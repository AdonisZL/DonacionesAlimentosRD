    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Maps API: detección de error de autenticación / API认证错误检测 -->
    <script>
      window.__googleMapsReady = false;
      window.__googleMapsError = null;
      function gm_authFailure() {
        window.__googleMapsError = "auth_failure";
        console.warn("Google Maps: error de autenticación. Verifica tu API Key.");
      }
    </script>
    <!-- Google Maps API: Places Autocomplete + Drawing Library / 地图API：地址自动补全 + 绘图库 -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBjwW7ksuN14-1KLkUsKj48G3jP4_JRMT8&libraries=places"
      async
      onload="window.__googleMapsReady=true"
      onerror="window.__googleMapsError='network_error'"
    ></script>
    <title>Donaciones de Alimentos RD</title>
  </head>
